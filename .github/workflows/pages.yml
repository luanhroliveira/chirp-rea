# Builds the web version (Kotlin/Wasm + Compose) and publishes it on GitHub Pages:
#   https://luanhroliveira.github.io/chirp-rea/
#
# One-time setup: repository Settings › Pages › Build and deployment ›
# Source = "GitHub Actions".
name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do núcleo
        run: ./gradlew :core:jvmTest --console=plain

      - name: Versão web
        run: ./gradlew :app:wasmJsBrowserDistribution --console=plain

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
